<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Co/Choc</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Raleway', sans-serif;
    }

    .fade-start {
  opacity: 0;
  transform: translateY(20px);
  animation: fadeStart 1.2s ease-out forwards;
}

@keyframes fadeStart {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
  </style>
</head>

<body class="bg-[#f5e6d3] overflow-x-hidden">

<!-- HERO -->
<section id="hero" class="relative h-screen flex items-center justify-center text-center overflow-hidden">

  <!-- BG IMAGE -->
  <div class="absolute inset-0">
    <img src="wallpaper.png" class="w-full h-full object-cover"/>

    <!-- optional overlay -->
    <div class="absolute inset-0 bg-black/20"></div>
  </div>
  
  <!-- CURVE SHAPE -->
  <div class="absolute bottom-0 w-full h-[120px] bg-[#f5e6d3] rounded-t-[100%] z-10"></div>

  <!-- TEXT -->
  <div id="heroText" class="relative z-20 opacity-0 translate-y-5">
    <h1 id="logo" class="text-[40px] font-bold tracking-[6px] text-gray-900 leading-none transition-all duration-700">
      Co / Choc
    </h1>

    <p id="tagline" class="text-[11px] font-bold tracking-[1px] mt-1 text-black transition-all duration-700">
      A way to enjoy bitter and sweet of life
    </p>
  </div>

</section>

<!-- LOGIN SECTION -->
<section id="loginSection" class="relative flex justify-center -mt-32 z-30 fade-in">

  <div class="w-[320px] h-[481px] bg-[#FCF2D9] border-2 border-[#834D1E] rounded-3xl p-5 shadow-xl">

    <!-- your existing login/signup code stays SAME -->
    <!-- Tabs -->
    <div class="flex border-2 border-[#834D1E] rounded-full overflow-hidden mb-6 font-[Inter]">
      <button onclick="showLogin()" id="loginTab" class="w-1/2 bg-[#834D1E] text-[#FCF2D9] text-[12px] font-semibold py-2">
        Login
      </button>
      <button onclick="showSignup()" id="signupTab" class="w-1/2 bg-[#FCF2D9] text-[#834D1E] text-[12px] font-semibold py-2">
        Sign Up
      </button>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm">
      <input type="text" placeholder="Username or email"
        class="w-full bg-transparent border-b-2 border-[#834D1E] text-[#834D1E] mb-6 outline-none"/>

      <input type="password" placeholder="Password"
        class="w-full bg-transparent border-b-2 border-[#834D1E] text-[#834D1E] mb-4 outline-none"/>

      <p class="text-right text-[10px] text-[#834D1E] mb-6">Forgot password?</p>

      <button class="w-full bg-[#834D1E] text-[#FCF2D9] py-3 rounded-full font-semibold">
        Login
      </button>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signupForm" class="hidden">
      <input type="email" placeholder="Email"
        class="w-full bg-transparent border-b-2 border-[#834D1E] text-[#834D1E] mb-5 outline-none"/>

      <input type="password" placeholder="Password"
        class="w-full bg-transparent border-b-2 border-[#834D1E] text-[#834D1E] mb-5 outline-none"/>

      <input type="password" placeholder="Confirm Password"
        class="w-full bg-transparent border-b-2 border-[#834D1E] text-[#834D1E] mb-6 outline-none"/>

      <button class="w-full bg-[#834D1E] text-[#FCF2D9] py-3 rounded-full font-semibold">
        Sign Up
      </button>
    </div>

  </div>
</section>

<!-- SCRIPT -->
<script>
  const logo = document.getElementById("logo");
  const tagline = document.getElementById("tagline");
  const loginSection = document.getElementById("loginSection");
  const smallHeader = document.getElementById("smallHeader");
  const heroText = document.getElementById("heroText");

  window.addEventListener("scroll", () => {
    let scrollY = window.scrollY;

    if (scrollY > 50) {

      // hide big center text
      heroText.classList.add("opacity-0");

      // show small header
      smallHeader.classList.remove("opacity-0");

      // show login
      loginSection.classList.add("show");

    } else {

      // show big text
      heroText.classList.remove("opacity-0");

      // hide small header
      smallHeader.classList.add("opacity-0");

      // hide login fade
      loginSection.classList.remove("show");
    }
  });
</script>

</body>
</html>

</body>
</html>
