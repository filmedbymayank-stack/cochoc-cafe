<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Co/Choc Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Raleway', sans-serif;
      background-color: #f5e6d3; /* Background color */
      overflow: hidden;
    }

    /* Fullscreen background */
    .background {
      background-image: url('wallpaper.png'); /* Replace with your image path */
      background-size: cover;
      background-position: center;
      height: 100vh;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Login card styling */
    .login-card {
      background: rgba(243, 230, 201, 0.9); /* Semi-transparent background */
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      width: 320px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .login-card h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .login-card p {
      margin-bottom: 20px;
      font-size: 14px;
      color: #8B5A2B; /* Text color */
    }

    .login-card input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #8B5A2B;
      border-radius: 5px;
      outline: none;
    }

    .login-card button {
      background-color: #8B4A0E; /* Button color */
      color: white;
      border: none;
      border-radius: 5px;
      padding: 10px;
      cursor: pointer;
      width: 100%;
    }

    .login-card button:hover {
      background-color: #7A3B0D; /* Darker shade on hover */
    }

    .forgot-password {
      display: block;
      margin-top: 10px;
      font-size: 12px;
      color: #8B5A2B;
    }
  </style>
</head>

<body>

  <div class="background">
    <div class="login-card">
      <h1>Co / Choc</h1>
      <p>A way to enjoy bitter and sweet of life</p>
      <input type="text" placeholder="Username or email" />
      <input type="password" placeholder="Password" />
      <button>Login</button>
      <a href="#" class="forgot-password">Forgot password?</a>
      <div class="flex justify-between mt-4">
        <button>Login</button>
        <button>Sign Up</button>
      </div>
    </div>
  </div>

</body>
</html>
