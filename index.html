<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Co/Choc Hero</title>
  <style>
    :root{
      --overlay: rgba(0,0,0,.55);
      --text: #fff;
    }

    *{box-sizing:border-box;}
    html,body{
      height:100%;
      margin:0;
      font-family: Inter, Roboto, Arial, sans-serif;
      background:#111;
      color:var(--text);
    }

    /* Fullscreen section with background image */
    .hero {
      position: relative;
      min-height: 100vh;
      width: 100%;
      overflow: hidden;
      display:flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #000;
    }

    /* Background image with cover and slight blur for a soft look */
    .hero__bg {
      position: absolute;
      inset: 0;
      background-image: url('wallpaper.png');
      background-size: cover;
      background-position: center;
      filter: saturate(0) brightness(0);
      transform: scale(1.02);
      z-index: 0;
    }

    /* Subtle overlay to mimic muted product shot */
    .hero__overlay {
      position: absolute;
      inset: 0;
      background: var(--overlay);
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 2;
      padding: 2rem;
    }

    .brand {
      font-weight: 600;
      letter-spacing: .2em;
      font-size: clamp(48px, 9vw, 120px);
      margin: 0;
      line-height: 0.9;
      text-transform: lowercase;
    }

    .tagline {
      margin-top: .75rem;
      font-size: clamp(16px, 2.5vw, 28px);
      font-weight: 500;
      letter-spacing: .04em;
      color: #e9e9e9;
    }
  </style>
</head>
<body>
  <section class="hero" aria-label="Hero Section">
    <div class="hero__bg" aria-hidden="true"></div>
    <div class="hero__overlay" aria-hidden="true"></div>

    <div class="content">
      <h1 class="brand" aria-label="Co slash Choc">
        co / choc
      </h1>
      <p class="tagline">A way to enjoy bitter and sweet of life</p>
    </div>
  </section>
</body>
</html>
