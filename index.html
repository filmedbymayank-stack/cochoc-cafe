<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Co/Choc</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Raleway', sans-serif;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s ease;
    }

    .show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body class="bg-[#f5e6d3] overflow-x-hidden">

<!-- HERO -->
<section id="hero" class="h-screen flex flex-col items-center justify-center text-center transition-all duration-700">
  
  <h1 id="logo" class="text-[40px] font-bold tracking-[6px] text-gray-900 leading-none transition-all duration-700">
    Co / Choc
  </h1>

  <p id="tagline" class="text-[11px] font-bold tracking-[1px] mt-1 text-black transition-all duration-700">
    A way to enjoy bitter and sweet of life
  </p>

</section>

<!-- LOGIN SECTION -->
<section id="loginSection" class="min-h-screen flex items-start justify-center pt-10 fade-in">

  <div class="w-[320px] h-[481px] bg-[#FCF2D9] border-2 border-[#834D1E] rounded-3xl p-5">

    <!-- Tabs -->
    <div class="flex border-2 border-[#834D1E] rounded-full overflow-hidden mb-6 font-[Inter]">
      <button onclick="showLogin()" id="loginTab" class="w-1/2 bg-[#834D1E] text-[#FCF2D9] text-[12px] font-semibold py-2">
        Login
      </button>
      <button onclick="showSignup()" id="signupTab" class="w-1/2 bg-[#FCF2D9] text-[#834D1E] text-[12px] font-semibold py-2">
        Sign Up
      </button>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm">
      <input type="text" placeholder="Username or email"
        class="w-full bg-transparent border-b-2 border-[#834D1E] text-[#834D1E] mb-6 outline-none"/>

      <input type="password" placeholder="Password"
        class="w-full bg-transparent border-b-2 border-[#834D1E] text-[#834D1E] mb-4 outline-none"/>

      <p class="text-right text-[10px] text-[#834D1E] mb-6">Forgot password?</p>

      <button class="w-full bg-[#834D1E] text-[#FCF2D9] py-3 rounded-full font-semibold">
        Login
      </button>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signupForm" class="hidden">
      <input type="email" placeholder="Email"
        class="w-full bg-transparent border-b-2 border-[#834D1E] text-[#834D1E] mb-5 outline-none"/>

      <input type="password" placeholder="Password"
        class="w-full bg-transparent border-b-2 border-[#834D1E] text-[#834D1E] mb-5 outline-none"/>

      <input type="password" placeholder="Confirm Password"
        class="w-full bg-transparent border-b-2 border-[#834D1E] text-[#834D1E] mb-6 outline-none"/>

      <button class="w-full bg-[#834D1E] text-[#FCF2D9] py-3 rounded-full font-semibold">
        Sign Up
      </button>
    </div>

  </div>
</section>

<!-- SCRIPT -->
<script>
  const logo = document.getElementById("logo");
  const tagline = document.getElementById("tagline");
  const loginSection = document.getElementById("loginSection");

  window.addEventListener("scroll", () => {
    let scrollY = window.scrollY;

    if (scrollY > 50) {
      logo.classList.add("text-[25px]");
      logo.classList.remove("text-[40px]");

      tagline.classList.add("text-[8px]");
      tagline.classList.remove("text-[11px]");

      loginSection.classList.add("show");
    }
  });

  function showLogin() {
    document.getElementById("loginForm").classList.remove("hidden");
    document.getElementById("signupForm").classList.add("hidden");

    document.getElementById("loginTab").classList.add("bg-[#834D1E]", "text-[#FCF2D9]");
    document.getElementById("loginTab").classList.remove("bg-[#FCF2D9]", "text-[#834D1E]");

    document.getElementById("signupTab").classList.add("bg-[#FCF2D9]", "text-[#834D1E]");
    document.getElementById("signupTab").classList.remove("bg-[#834D1E]", "text-[#FCF2D9]");
  }

  function showSignup() {
    document.getElementById("signupForm").classList.remove("hidden");
    document.getElementById("loginForm").classList.add("hidden");

    document.getElementById("signupTab").classList.add("bg-[#834D1E]", "text-[#FCF2D9]");
    document.getElementById("signupTab").classList.remove("bg-[#FCF2D9]", "text-[#834D1E]");

    document.getElementById("loginTab").classList.add("bg-[#FCF2D9]", "text-[#834D1E]");
    document.getElementById("loginTab").classList.remove("bg-[#834D1E]", "text-[#FCF2D9]");
  }
</script>

</body>
</html>
