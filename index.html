<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Co/Choc</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Raleway', sans-serif;
    }

    /* Initial hero animation */
    .hero-enter {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s ease forwards;
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Small state for Co/Choc on scroll */
    .small-state .coch-title {
      font-size: 25px;
      line-height: 1.2;
      letter-spacing: 1px;
    }
    .small-state .coch-line {
      height: 2px;
    }

    /* Login card animation when appearing from hero */
    .login-appear {
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.6s ease;
    }
    .login-appear.visible {
      transform: translateY(0);
      opacity: 1;
    }

  </style>
</head>

<body class="bg-[#f5e6d3] overflow-x-hidden">

  <!-- HERO -->
  <section id="hero" class="relative h-[85vh] flex items-center justify-center text-center overflow-hidden bg-no-repeat bg-cover" style="background-image:url('wallpaper.png');">
    <div class="absolute inset-0 bg-black/20"></div>

    <div id="heroContent" class="relative z-10">
      <h1 id="coChoc" class="text-[40px] font-bold tracking-[6px] text-black hero-enter coch-title">
        Co / Choc
      </h1>

      <p id="subtitle" class="text-[11px] mt-1 font-semibold hero-enter" style="animation-delay:.1s;">
        A way to enjoy bitter and sweet of life
      </p>

      <!-- decorative line under text (same color scheme) -->
      <div id="line" class="mx-auto h-1 w-48 bg-black/70 rounded-full mt-3 hero-enter" style="width: 260px; animation-delay:.2s;"></div>
    </div>
  </section>

  <section id="loginSection" class="flex justify-center py-12">

      <!-- Tabs -->
      <div class="flex mb-6 bg-[#E8D7B5] rounded-full overflow-hidden border border-[#8B5A2B]">
        <button id="loginTab" class="w-1/2 py-2 bg-[#8B4A0E] text-white rounded-full" aria-label="Login tab">
          Login
        </button>

        <button id="signupTab" class="w-1/2 py-2 text-[#8B4A0E]" aria-label="Sign Up tab">
          Sign Up
        </button>
      </div>

      <!-- LOGIN FORM -->
      <div id="loginForm" class="aria-hidden-block">
        <label for="loginUser" class="sr-only">Username or email</label>
        <input id="loginUser" type="text" placeholder="Username or email"

          class="w-full bg-transparent border-b-2 border-[#8B5A2B] mb-2 pb-2 outline-none placeholder-[#8B5A2B]" />
