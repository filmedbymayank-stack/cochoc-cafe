<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Co/Choc</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Raleway', sans-serif;
    }
  </style>
</head>

<body class="bg-[#f5e6d3] overflow-x-hidden relative">

<!-- HERO -->
<section class="relative h-[85vh] flex items-center justify-center text-center overflow-hidden">

  <img src="wallpaper.png" class="absolute inset-0 w-full h-full object-cover"/>
  <div class="absolute inset-0 bg-black/20"></div>

  <div class="relative z-10">
    <h1 class="text-[40px] font-bold tracking-[6px] text-black">
      Co / Choc
    </h1>
    <p class="text-[11px] mt-1 font-semibold">
      A way to enjoy bitter and sweet of life
    </p>
  </div>

</section>

<!-- LOGIN -->
<section class="-mt-40 flex justify-center">

  <div class="w-[320px] p-6 
  bg-[#F3E6C9] 
  border-2 border-[#8B5A2B] 
  rounded-[40px] 
  shadow-lg">

    <!-- Tabs -->
    <div class="flex mb-6 bg-[#E8D7B5] rounded-full overflow-hidden border border-[#8B5A2B]">
      
      <button id="loginTab" onclick="showLogin()" 
      class="w-1/2 py-2 bg-[#8B4A0E] text-white rounded-full">
        Login
      </button>

      <button id="signupTab" onclick="showSignup()" 
      class="w-1/2 py-2 text-[#8B4A0E]">
        Sign Up
      </button>

    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm">

      <input type="text" placeholder="Username or email"
      class="w-full bg-transparent border-b-2 border-[#8B5A2B] mb-6 pb-2 outline-none placeholder-[#8B5A2B]" />

      <input type="password" placeholder="Password"
      class="w-full bg-transparent border-b-2 border-[#8B5A2B] mb-2 pb-2 outline-none placeholder-[#8B5A2B]" />

      <p class="text-right text-sm text-[#8B5A2B] mb-6">
        Forgot password?
      </p>

      <button onclick="openPopup()" 
class="px-6 py-2 bg-[#8B4A0E] text-white rounded-full">
  Login
      </button>

    </div>

    <!-- SIGNUP FORM -->
    <div id="signupForm" class="hidden">

      <input type="email" placeholder="Email"
      class="w-full bg-transparent border-b-2 border-[#8B5A2B] mb-4 pb-2 outline-none placeholder-[#8B5A2B]" />

      <input type="password" placeholder="Password"
      class="w-full bg-transparent border-b-2 border-[#8B5A2B] mb-4 pb-2 outline-none placeholder-[#8B5A2B]" />

      <input type="password" placeholder="Confirm Password"
      class="w-full bg-transparent border-b-2 border-[#8B5A2B] mb-6 pb-2 outline-none placeholder-[#8B5A2B]" />

      <button class="w-full py-3 bg-[#8B4A0E] text-white rounded-full text-lg">
        Sign Up
      </button>

    </div>

  </div>

</section>

<!-- POPUP -->
<div id="popup" class="fixed inset-0 flex items-center justify-center bg-black/30 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-500">

  <div id="popupBox" class="bg-[#FCF2D9] border-2 border-[#834D1E] rounded-2xl p-6 w-[260px] text-center shadow-xl scale-90 transition-all duration-500">

    <div class="flex justify-center mb-3">
      <div class="w-12 h-12 border-2 border-[#834D1E] rounded-full flex items-center justify-center">
        
        <svg class="w-6 h-6 text-[#834D1E]" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
          <path id="tick" d="M5 13l4 4L19 7" stroke-dasharray="30" stroke-dashoffset="30"/>
        </svg>

      </div>
    </div>

    <h2 class="text-[#834D1E] font-bold text-lg mb-2">
      You're almost there
    </h2>

    <p class="text-[#834D1E] text-xs">
      now let's get started
    </p>

  </div>

</div>
<!-- SCRIPT -->
<script>
function openPopup() {
  const popup = document.getElementById("popup");
  const box = document.getElementById("popupBox");
  const tick = document.getElementById("tick");

  popup.classList.remove("opacity-0", "pointer-events-none");
  box.classList.remove("scale-90");

  setTimeout(() => {
    tick.style.transition = "stroke-dashoffset 0.6s ease";
    tick.style.strokeDashoffset = "0";
  }, 300);

  setTimeout(() => {
    popup.classList.add("opacity-0", "pointer-events-none");
    box.classList.add("scale-90");
  }, 2000);
}
  setTimeout(() => {
  window.location.href = "home.html";
}, 2000);
</script>

</body>
</html>
