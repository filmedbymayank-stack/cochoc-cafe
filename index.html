<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Co/Choc</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Raleway', sans-serif;
      overflow: hidden;
    }

    /* Background and hero section */
    #hero {
      background-image: url('wallpaper.png');
      background-size: cover;
      background-position: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .hero-enter {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeIn 0.8s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .small-state {
      animation: shrink 0.6s forwards;
    }

    @keyframes shrink {
      to { font-size: 25px; transform: translateY(-20px); }
    }

    /* Login card */
    #loginCard {
      width: 320px;
      padding: 20px;
      background: rgba(243, 230, 201, 0.9);
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      animation: fadeInCard 0.6s forwards;
      z-index: 10;
    }

    @keyframes fadeInCard {
      to { opacity: 1; }
    }
  </style>
</head>

<body>

  <section id="hero" class="relative">
    <div id="heroContent" class="text-center">
      <h1 id="coChoc" class="text-5xl font-bold hero-enter">Co / Choc</h1>
      <p id="subtitle" class="text-lg mt-2 hero-enter" style="animation-delay:.1s;">A way to enjoy bitter and sweet of life</p>
    </div>
  </section>

  <div id="loginCard">
    <div class="flex mb-4">
      <button id="loginTab" class="w-1/2 bg-brown-600 text-white rounded-full">Login</button>
      <button id="signupTab" class="w-1/2 text-brown-600">Sign Up</button>
    </div>

    <input type="text" placeholder="Username or email" class="w-full border-b-2 mb-4" />
    <input type="password" placeholder="Password" class="w-full border-b-2 mb-4" />
    <button class="w-full bg-brown-600 text-white rounded-full">Login</button>
  </div>

  <script>
    setTimeout(() => {
      document.getElementById('coChoc').classList.add('small-state');
      document.getElementById('loginCard').style.opacity = 1;
    }, 2000);
  </script>

</body>
</html>
