<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Co/Choc</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Raleway', sans-serif;
    }
  </style>
</head>

<body class="bg-[#f5e6d3] overflow-x-hidden">

<!-- HERO -->
<section id="hero" class="relative h-[85vh] overflow-hidden flex items-center justify-center text-center">

  <div id="bgWrapper" class="absolute inset-0 overflow-hidden transition-all duration-700">
    <img id="bgImage" src="wallpaper.png" class="w-full h-full object-cover transition-all duration-700"/>
    <div class="absolute inset-0 bg-black/20"></div>
  </div>

  <!-- BIG TEXT -->
  <div id="heroText" class="relative z-20 opacity-0 translate-y-5 transition-all duration-1000">
    <h1 class="text-[40px] font-bold tracking-[6px] text-gray-900 leading-none">
      Co / Choc
    </h1>
    <p class="text-[11px] font-bold tracking-[1px] mt-1 text-black">
      A way to enjoy bitter and sweet of life
    </p>
  </div>

  <!-- SMALL HEADER (MOVED UP MORE) -->
  <div id="smallHeader" class="absolute bottom-[24%] left-1/2 -translate-x-1/2 text-center z-30 opacity-0 transition-all duration-700">
    <h1 class="text-[25px] font-bold tracking-[4px] text-gray-900 leading-none">
      Co / Choc
    </h1>
    <p class="text-[8px] font-bold tracking-[1px] mt-1 text-black">
      A way to enjoy bitter and sweet of life
    </p>
  </div>

</section>

<!-- LOGIN -->
<section class="pb-16">

  <!-- MOVED UP -->
  <section id="loginSection" class="relative flex justify-center -mt-36 z-20 opacity-0 translate-y-10 transition-all duration-700">

    <div class="w-[260px] h-[420px] bg-[#FCF2D9] border-2 border-[#834D1E] rounded-3xl p-4 shadow-xl">

      <div class="flex border-2 border-[#834D1E] rounded-full overflow-hidden mb-5 font-[Inter]">
        
        <button onclick="showLogin()" id="loginTab"
          class="w-1/2 text-[11px] font-semibold py-2 bg-[#834D1E] text-[#FCF2D9]">
          Login
        </button>

        <button onclick="showSignup()" id="signupTab"
          class="w-1/2 text-[11px] font-semibold py-2 bg-[#FCF2D9] text-[#834D1E]">
          Sign Up
        </button>

      </div>

      <div id="loginForm">
        <input type="text" placeholder="Username or email"
          class="w-full bg-transparent border-b-2 border-[#834D1E] text-[#834D1E] placeholder-[#834D1E] mb-5 outline-none text-sm"/>

        <input type="password" placeholder="Password"
          class="w-full bg-transparent border-b-2 border-[#834D1E] text-[#834D1E] placeholder-[#834D1E] mb-3 outline-none text-sm"/>

        <p class="text-right text-[9px] text-[#834D1E] mb-5">Forgot password?</p>

        <button class="w-full bg-[#834D1E] text-[#FCF2D9] py-2 rounded-full text-sm font-semibold">
          Login
        </button>
      </div>

      <div id="signupForm" class="hidden">
        <input type="email" placeholder="Email"
          class="w-full bg-transparent border-b-2 border-[#834D1E] text-[#834D1E] placeholder-[#834D1E] mb-4 outline-none text-sm"/>

        <input type="password" placeholder="Password"
          class="w-full bg-transparent border-b-2 border-[#834D1E] text-[#834D1E] placeholder-[#834D1E] mb-4 outline-none text-sm"/>

        <input type="password" placeholder="Confirm Password"
          class="w-full bg-transparent border-b-2 border-[#834D1E] text-[#834D1E] placeholder-[#834D1E] mb-5 outline-none text-sm"/>

        <button class="w-full bg-[#834D1E] text-[#FCF2D9] py-2 rounded-full text-sm font-semibold">
          Sign Up
        </button>
      </div>

    </div>

  </section>

</section>

<script>
  const heroText = document.getElementById("heroText");
  const smallHeader = document.getElementById("smallHeader");
  const loginSection = document.getElementById("loginSection");
  const bgWrapper = document.getElementById("bgWrapper");
  const bgImage = document.getElementById("bgImage");

  const loginTab = document.getElementById("loginTab");
  const signupTab = document.getElementById("signupTab");

  window.addEventListener("load", () => {
    setTimeout(() => {
      heroText.classList.remove("opacity-0", "translate-y-5");
    }, 100);
  });

  window.addEventListener("scroll", () => {
    let scrollY = window.scrollY;

    if (scrollY > 50) {
      bgWrapper.classList.add("rounded-b-[120px]");
      bgImage.classList.add("-translate-y-6");

      heroText.classList.add("opacity-0");
      smallHeader.classList.remove("opacity-0");
      loginSection.classList.remove("opacity-0", "translate-y-10");

    } else {
      bgWrapper.classList.remove("rounded-b-[120px]");
      bgImage.classList.remove("-translate-y-6");

      heroText.classList.remove("opacity-0");
      smallHeader.classList.add("opacity-0");
      loginSection.classList.add("opacity-0", "translate-y-10");
    }
  });

  function showLogin() {
    document.getElementById("loginForm").classList.remove("hidden");
    document.getElementById("signupForm").classList.add("hidden");

    loginTab.className = "w-1/2 text-[11px] font-semibold py-2 bg-[#834D1E] text-[#FCF2D9]";
    signupTab.className = "w-1/2 text-[11px] font-semibold py-2 bg-[#FCF2D9] text-[#834D1E]";
  }

  function showSignup() {
    document.getElementById("signupForm").classList.remove("hidden");
    document.getElementById("loginForm").classList.add("hidden");

    signupTab.className = "w-1/2 text-[11px] font-semibold py-2 bg-[#834D1E] text-[#FCF2D9]";
    loginTab.className = "w-1/2 text-[11px] font-semibold py-2 bg-[#FCF2D9] text-[#834D1E]";
  }
</script>

</body>
</html>
