<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Order</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#FCF2D9] text-[#834D1E] p-5">

<h1 class="text-xl font-semibold mb-4">Your Order</h1>

<!-- ITEM -->
<div class="bg-white rounded-xl p-4 shadow">
  <img id="itemImg" class="w-full h-40 object-cover rounded-lg">

  <h2 id="itemTitle" class="mt-3 font-semibold"></h2>
  <p id="itemPrice" class="text-sm mt-1"></p>
</div>

<!-- FORM -->
<div class="mt-6 space-y-4">

  <!-- TABLE NUMBER -->
  <input id="tableNo" type="number" placeholder="Enter Table Number"
    class="w-full p-3 rounded-lg border border-gray-300"/>

  <!-- NAME -->
  <input id="name" type="text" placeholder="Your Name"
    class="w-full p-3 rounded-lg border border-gray-300"/>

  <!-- NOTES -->
  <textarea id="notes" placeholder="Extra notes..."
    class="w-full p-3 rounded-lg border border-gray-300"></textarea>

</div>

<!-- TOTAL -->
<div class="mt-6 bg-white p-4 rounded-xl shadow">
  <div class="flex justify-between">
    <span>Total</span>
    <span id="totalPrice"></span>
  </div>
</div>

<!-- BUTTON -->
<button onclick="placeOrder()" 
  class="w-full mt-6 bg-[#834D1E] text-white py-3 rounded-xl">
  Place Order
</button>

<script>
const data = JSON.parse(localStorage.getItem("order"));

document.getElementById("itemImg").src = data.img;
document.getElementById("itemTitle").innerText = data.title;
document.getElementById("itemPrice").innerText = data.price;
document.getElementById("totalPrice").innerText = data.price;

function placeOrder() {
  const table = document.getElementById("tableNo").value;
  const name = document.getElementById("name").value;

  if (!table || !name) {
    alert("Please fill all details!");
    return;
  }

  alert("Order Placed Successfully ✅");
}
</script>

</body>
</html>
