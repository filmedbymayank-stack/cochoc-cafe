<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Orders</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-[#FCF2D9] text-[#834D1E]">

<!-- HEADER -->
<div class="px-5 pt-6">
  <div class="flex justify-between items-center">
    <h1 class="text-lg font-semibold">Your orders</h1>

    <div class="flex gap-4 text-xl">
      <span>🔔</span>
      <span class="cursor-pointer">≡</span>
    </div>
  </div>
</div>

<!-- TABS -->
<div class="px-5 mt-4">
  <div class="flex border border-[#834D1E] rounded-full overflow-hidden text-sm">

    <button onclick="showTab('recent')" id="tabRecent"
      class="w-1/2 py-2 bg-[#834D1E] text-[#FCF2D9]">
      Recently
    </button>

    <button onclick="showTab('past')" id="tabPast"
      class="w-1/2 py-2 bg-[#FCF2D9] text-[#834D1E]">
      Past Orders
    </button>

  </div>
</div>

<!-- ORDER LIST -->
<div class="px-5 mt-5 space-y-4 pb-24">

  <!-- RECENT -->
  <div id="recent">

    <!-- CARD -->
    <div class="flex items-center gap-3 border border-[#834D1E]/40 rounded-2xl p-3">
      <img src="Lem1.png" class="w-16 h-16 rounded-xl object-cover"/>

      <div class="flex-1">
        <h3 class="font-semibold">2x Iced Lemonade</h3>
        <p class="text-xs opacity-70">Details</p>
      </div>

      <p class="text-xs">04/02</p>
    </div>

    <div class="flex items-center gap-3 border border-[#834D1E]/40 rounded-2xl p-3">
      <img src="Iced.png" class="w-16 h-16 rounded-xl object-cover"/>

      <div class="flex-1">
        <h3 class="font-semibold">1x Iced Coffee Sweet Heaven</h3>
        <p class="text-xs opacity-70">Details</p>
      </div>

      <p class="text-xs">03/02</p>
    </div>

    <div class="flex items-center gap-3 border border-[#834D1E]/40 rounded-2xl p-3">
      <img src="Ch1.png" class="w-16 h-16 rounded-xl object-cover"/>

      <div class="flex-1">
        <h3 class="font-semibold">2x Hot Chocolate</h3>
        <p class="text-xs opacity-70">Details</p>
      </div>

      <p class="text-xs">02/02</p>
    </div>

  </div>

  <!-- PAST -->
  <div id="past" class="hidden">

    <div class="flex items-center gap-3 border border-[#834D1E]/40 rounded-2xl p-3">
      <img src="Hot.png" class="w-16 h-16 rounded-xl object-cover"/>

      <div class="flex-1">
        <h3 class="font-semibold">1x Hot Cappuccino</h3>
        <p class="text-xs opacity-70">Details</p>
      </div>

      <p class="text-xs">28/01</p>
    </div>

    <div class="flex items-center gap-3 border border-[#834D1E]/40 rounded-2xl p-3">
      <img src="Iced1.png" class="w-16 h-16 rounded-xl object-cover"/>

      <div class="flex-1">
        <h3 class="font-semibold">2x Iced Coffee Lemonade</h3>
        <p class="text-xs opacity-70">Details</p>
      </div>

      <p class="text-xs">27/01</p>
    </div>

    <div class="flex items-center gap-3 border border-[#834D1E]/40 rounded-2xl p-3">
      <img src="Ch1.png" class="w-16 h-16 rounded-xl object-cover"/>

      <div class="flex-1">
        <h3 class="font-semibold">1x Iced Chocolate</h3>
        <p class="text-xs opacity-70">Details</p>
      </div>

      <p class="text-xs">24/01</p>
    </div>

  </div>

</div>

<!-- BOTTOM NAV -->
<div class="fixed bottom-0 w-full bg-[#834D1E] text-[#FCF2D9] flex justify-around py-3 text-xs">

  <div class="flex flex-col items-center opacity-70"
    onclick="window.location.href='home.html'">
    <span>🏠</span>
    <p>Home</p>
  </div>

  <div class="flex flex-col items-center opacity-70"
    onclick="window.location.href='menu.html'">
    <span>☕</span>
    <p>Drink Menu</p>
  </div>

  <div class="flex flex-col items-center">
    <span>📄</span>
    <p>Your Order</p>
  </div>

  <div class="flex flex-col items-center opacity-70">
    <span>❤️</span>
    <p>Favorites</p>
  </div>

</div>

<!-- SCRIPT -->
<script>
function showTab(tab) {
  const tabs = ["recent", "past"];
  const tabButtons = {
    recent: "tabRecent",
    past: "tabPast"
  };

  tabs.forEach(t => {
    document.getElementById(t).classList.add("hidden");
    document.getElementById(tabButtons[t]).className =
      "w-1/2 py-2 bg-[#FCF2D9] text-[#834D1E]";
  });

  document.getElementById(tab).classList.remove("hidden");
  document.getElementById(tabButtons[tab]).className =
    "w-1/2 py-2 bg-[#834D1E] text-[#FCF2D9]";
}
</script>

</body>
</html>
