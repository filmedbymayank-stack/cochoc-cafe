<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Co/Choc Home</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-[#FCF2D9] text-[#834D1E]">

<!-- HEADER -->
<div class="flex justify-between items-center px-5 pt-6">

  <h1 class="text-sm font-semibold">
    Good day, John Smith
  </h1>

  <div class="flex gap-4 text-xl">
    <span>🔔</span>
    <span>≡</span>
  </div>

</div>

<!-- BEST SELLER CARD -->
<div class="px-5 mt-6">
  <div class="bg-[#834D1E] text-[#FCF2D9] rounded-2xl p-4 flex justify-between items-center shadow-md">

    <div>
      <p class="text-xs opacity-80 mb-1">Best seller of the week</p>
      <h2 class="text-lg font-bold leading-tight">
        Iced Coffee <br> Sweet Heaven
      </h2>

      <p class="text-xs mt-3 flex items-center gap-1">
        More info →
      </p>
    </div>

    <img src="coffee1.png" class="w-20 h-24 object-cover rounded-xl"/>
  </div>
</div>

<!-- RECOMMENDATIONS -->
<div class="px-5 mt-6">

  <div class="flex justify-between items-center mb-3">
    <h2 class="text-sm font-semibold">This week’s recommendations</h2>
    <p class="text-xs">See all</p>
  </div>

  <div class="flex gap-4">

    <!-- ITEM 1 -->
    <div class="w-[140px] h-[170px] relative rounded-2xl overflow-hidden shadow-md">
      <img src="coffee2.png" class="w-full h-full object-cover"/>

      <div class="absolute bottom-0 w-full p-2 bg-gradient-to-t from-black/60 to-transparent text-white text-xs">
        <p>Iced Americano</p>
        <p class="font-bold">₹200</p>
      </div>
    </div>

    <!-- ITEM 2 -->
    <div class="w-[140px] h-[170px] relative rounded-2xl overflow-hidden shadow-md">
      <img src="coffee3.png" class="w-full h-full object-cover"/>

      <div class="absolute bottom-0 w-full p-2 bg-gradient-to-t from-black/60 to-transparent text-white text-xs">
        <p>Hot Cappuccino</p>
        <p class="font-bold">₹240</p>
      </div>
    </div>

  </div>

</div>

<!-- SHOP SECTION -->
<div class="px-5 mt-6 mb-24">

  <h2 class="text-sm font-semibold mb-3">What’s in the shop?</h2>

  <div class="w-full h-[150px] rounded-2xl overflow-hidden relative shadow-md">
    <img src="lemon.png" class="w-full h-full object-cover"/>

    <div class="absolute inset-0 bg-black/30 flex items-center p-4">
      <p class="text-white font-semibold text-sm">
        Introducing our new lemonade menu
      </p>
    </div>
  </div>

</div>

<!-- BOTTOM NAV -->
<div class="fixed bottom-0 w-full bg-[#834D1E] text-[#FCF2D9] flex justify-around py-3 text-xs">

  <div class="flex flex-col items-center">
    <span>🏠</span>
    <p>Home</p>
  </div>

  <div class="flex flex-col items-center opacity-70">
    <span>☕</span>
    <p>Drink Menu</p>
  </div>

  <div class="flex flex-col items-center opacity-70">
    <span>📄</span>
    <p>Your Order</p>
  </div>

  <div class="flex flex-col items-center opacity-70">
    <span>❤️</span>
    <p>Favorites</p>
  </div>

</div>

</body>
</html>
