<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Favourite</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    @keyframes scaleUp {
      0% {
        transform: scale(0.8);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .animate-scaleUp {
      animation: scaleUp 0.3s ease;
    }
  </style>
</head>

<body class="bg-[#FCF2D9] text-[#834D1E]">

<!-- HEADER -->
<div class="px-5 pt-6">
  <div class="flex justify-between items-center">
    <h1 class="text-lg font-semibold">Favourite</h1>

    <div class="flex gap-4 text-xl">
      <img src="Notification.png" class="w-8 h-8"/>
      <span onclick="openNav()" class="cursor-pointer">
        <img src="Menu.png" class="w-7 h-7">
      </span>
    </div>
  </div>
</div>

<!-- TITLE -->
<div class="px-5 mt-4">
  <h1 class="text-xl font-semibold leading-snug">
    Your favorite drinks to<br>lighten up your day
  </h1>
</div>

<!-- GRID -->
<div class="px-5 mt-5 pb-24">
  <div class="grid grid-cols-2 gap-4">

    <!-- CARD 1 -->
    <div onclick="openModal('Iced.png','Iced Coffee Sweet Heaven','Double espresso with condensed milk, served cold','Rp 24.000')" 
         class="relative rounded-2xl overflow-hidden cursor-pointer">
      <img src="Iced.png" class="w-full h-52 object-cover">
      <div class="absolute inset-0 bg-black/30"></div>

      <div class="absolute bottom-3 left-3 text-white">
        <h3 class="font-semibold leading-tight">Iced Coffee<br>Sweet Heaven</h3>
        <p class="text-sm mt-1">Rp 24.000</p>
      </div>

      <img src="Heart.png" class="absolute bottom-3 right-3 w-7 h-7 bg-white/80 p-1 rounded-full shadow"/>
    </div>

    <!-- CARD 2 -->
    <div onclick="openModal('Ch1.png','Iced Chocolate','Sweet cold chocolate drink','Rp 22.000')" 
         class="relative rounded-2xl overflow-hidden cursor-pointer">
      <img src="Ch1.png" class="w-full h-52 object-cover">
      <div class="absolute inset-0 bg-black/30"></div>

      <div class="absolute bottom-3 left-3 text-white">
        <h3 class="font-semibold">Iced Chocolate</h3>
        <p class="text-sm mt-1">Rp 22.000</p>
      </div>

      <img src="Heart.png" class="absolute bottom-3 right-3 w-7 h-7 bg-white/80 p-1 rounded-full shadow"/>
    </div>

    <!-- CARD 3 -->
    <div onclick="openModal('Lem1.png','Iced Lemonade','Fresh lemon drink with mint','Rp 18.000')" 
         class="relative rounded-2xl overflow-hidden cursor-pointer">
      <img src="Lem1.png" class="w-full h-52 object-cover">
      <div class="absolute inset-0 bg-black/30"></div>

      <div class="absolute bottom-3 left-3 text-white">
        <h3 class="font-semibold">Iced Lemonade</h3>
        <p class="text-sm mt-1">Rp 18.000</p>
      </div>

      <img src="Heart.png" class="absolute bottom-3 right-3 w-7 h-7 bg-white/80 p-1 rounded-full shadow"/>
    </div>

    <!-- CARD 4 -->
    <div onclick="openModal('Hot.png','Hot Cappuccino','Hot creamy cappuccino','Rp 24.000')" 
         class="relative rounded-2xl overflow-hidden cursor-pointer">
      <img src="Hot.png" class="w-full h-52 object-cover">
      <div class="absolute inset-0 bg-black/30"></div>

      <div class="absolute bottom-3 left-3 text-white">
        <h3 class="font-semibold">Hot Cappuccino</h3>
        <p class="text-sm mt-1">Rp 24.000</p>
      </div>

      <img src="Heart.png" class="absolute bottom-3 right-3 w-7 h-7 bg-white/80 p-1 rounded-full shadow"/>
    </div>

    <!-- CARD 5 -->
    <div onclick="openModal('Iced1.png','Iced Coffee Lemonade','Unique coffee + lemon mix','Rp 25.000')" 
         class="relative rounded-2xl overflow-hidden cursor-pointer">
      <img src="Iced1.png" class="w-full h-52 object-cover">
      <div class="absolute inset-0 bg-black/30"></div>

      <div class="absolute bottom-3 left-3 text-white">
        <h3 class="font-semibold leading-tight">Iced Coffee<br>Lemonade</h3>
        <p class="text-sm mt-1">Rp 25.000</p>
      </div>

      <img src="Heart.png" class="absolute bottom-3 right-3 w-7 h-7 bg-white/80 p-1 rounded-full shadow"/>
    </div>

  </div>
</div>

<!-- MODAL -->
<div id="modal" onclick="closeModal()" 
     class="fixed inset-0 bg-black/60 z-[9999] hidden items-center justify-center">

  <div onclick="event.stopPropagation()" 
       class="bg-[#FCF2D9] w-[90%] max-w-md rounded-[30px] overflow-hidden relative animate-scaleUp">

    <button onclick="closeModal()" 
      class="absolute top-4 left-4 text-xl font-bold text-[#834D1E]">✕</button>

    <img id="modalImg" src="" class="w-full h-64 object-cover">

    <div class="p-5 text-[#834D1E]">
      <h2 id="modalTitle" class="text-lg font-semibold"></h2>
      <p id="modalDesc" class="text-sm mt-2 opacity-80"></p>
      <p id="modalPrice" class="text-xl font-bold mt-4"></p>

      <button class="w-full mt-5 bg-[#834D1E] text-white py-3 rounded-xl">
        Buy Now
      </button>
    </div>

  </div>
</div>

<script>
function openModal(img, title, desc, price) {
  const modal = document.getElementById("modal");
  modal.classList.remove("hidden");
  modal.classList.add("flex");

  document.getElementById("modalImg").src = img;
  document.getElementById("modalTitle").innerText = title;
  document.getElementById("modalDesc").innerText = desc;
  document.getElementById("modalPrice").innerText = price;
}

function closeModal() {
  const modal = document.getElementById("modal");
  modal.classList.add("hidden");
}
</script>

</body>
</html>
