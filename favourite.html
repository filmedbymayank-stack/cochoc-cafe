<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <div class="drink-grid">
            
            <a href="#iced-coffee-modal" class="card">
                <img src="iced-coffee.jpg" alt="...">
                <h3>Iced Coffee Sweet Heaven</h3>
                <p>Rp 24.000</p>
            </a>

            <a href="#iced-chocolate-modal" class="card">
                </a>

            </div>

        </div>


    <div id="iced-coffee-modal" class="modal-overlay">
        <a href="#" class="close-overlay"></a>

        <div class="modal-content">
            <div class="modal-header-actions">
                <a href="#" class="close-btn">X</a>
                <span class="heart-icon">🤍</span>
            </div>
            
            <img src="iced-coffee.jpg" alt="...">
            <h2>Iced Coffee Sweet Heaven</h2>
            <p class="description">Double espresso with condensed milk, served cold.</p>
            <span class="price">Rp 24.000</span>

            <div class="purchase-section">
                <div class="quantity"> - 1 + </div>
                <button class="buy-now">Buy Now</button>
            </div>
        </div>
    </div>


    <div id="iced-chocolate-modal" class="modal-overlay">
        </div>


</body>
</html>
