<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Drink Menu</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-[#FCF2D9] text-[#834D1E]">

<!-- HEADER -->
<div class="px-5 pt-6">
  <div class="flex justify-between items-center">
    <h1 class="text-lg font-semibold leading-tight">
      What would you <br> like to drink today?
    </h1>

    <div class="flex gap-4 text-xl">
      <span><img src="Notification.png" class="w-8 h-8"/></span></span>
    <span onclick="openNav()" class="cursor-pointer"><span><img src="Menu.png" class="w-7 h-7"></span></span>
    </div>
  </div>

  <!-- SEARCH -->
  <input type="text" placeholder="Search.." 
    class="w-full mt-4 px-4 py-2 rounded-full border border-[#834D1E]/40 outline-none bg-transparent"/>
</div>

<!-- TABS -->
<div class="px-5 mt-4">
  <div class="flex border border-[#834D1E] rounded-full overflow-hidden text-sm">

    <button onclick="showTab('coffee')" id="tabCoffee"
      class="w-1/3 py-2 bg-[#834D1E] text-[#FCF2D9]">
      Coffee
    </button>

    <button onclick="showTab('chocolate')" id="tabChocolate"
      class="w-1/3 py-2 bg-[#FCF2D9] text-[#834D1E]">
      Chocolate
    </button>

    <button onclick="showTab('others')" id="tabOthers"
      class="w-1/3 py-2 bg-[#FCF2D9] text-[#834D1E]">
      Others
    </button>

  </div>
</div>

<!-- MENU LIST -->
<div class="px-5 mt-5 space-y-4 pb-24">

  <!-- COFFEE -->
  <div id="coffee">

    <div class="flex gap-3 items-center">
      <img src="Iced.png" class="w-16 h-16 rounded-xl object-cover"/>
      <div class="flex-1">
        <h3 class="font-semibold">Iced Americano</h3>
        <p class="text-xs opacity-70">Double espresso and water</p>
        <p class="font-semibold mt-1">₹200</p>
      </div>
      <button class="bg-[#834D1E] text-white w-8 h-8 rounded-lg">+</button>
    </div>

    <div class="flex gap-3 items-center">
      <img src="Hot.png" class="w-16 h-16 rounded-xl object-cover"/>
      <div class="flex-1">
        <h3 class="font-semibold">Iced Coffee Sweet</h3>
        <p class="text-xs opacity-70">With milk & cream</p>
        <p class="font-semibold mt-1">₹240</p>
      </div>
      <button class="bg-[#834D1E] text-white w-8 h-8 rounded-lg">+</button>
    </div>

  </div>

  <!-- CHOCOLATE -->
  <div id="chocolate" class="hidden">

    <div class="flex gap-3 items-center">
      <img src="Ch1.png" class="w-16 h-16 rounded-xl object-cover"/>
      <div class="flex-1">
        <h3 class="font-semibold">Hot Chocolate</h3>
        <p class="text-xs opacity-70">Sweetened dark chocolate</p>
        <p class="font-semibold mt-1">₹200</p>
      </div>
      <button class="bg-[#834D1E] text-white w-8 h-8 rounded-lg">+</button>
    </div>

  </div>

  <!-- OTHERS -->
  <div id="others" class="hidden">

    <div class="flex gap-3 items-center">
      <img src="Lem1.png" class="w-16 h-16 rounded-xl object-cover"/>
      <div class="flex-1">
        <h3 class="font-semibold">Iced Lemonade</h3>
        <p class="text-xs opacity-70">Fresh lemon drink</p>
        <p class="font-semibold mt-1">₹180</p>
      </div>
      <button class="bg-[#834D1E] text-white w-8 h-8 rounded-lg">+</button>
    </div>

  </div>

</div>

<!-- BOTTOM NAV -->
<div class="fixed bottom-0 w-full bg-[#834D1E] text-[#FCF2D9] flex justify-around py-3 text-xs">

  <div class="flex flex-col items-center opacity-70"
    onclick="window.location.href='home.html'">
    <span><img src="Home.png" class="w-8 h-8 rounded-full object-cover"/></span></span>
    <p>Home</p>
  </div>

  <div class="flex flex-col items-center opacity-70"
    <span><img src="Coffee1.png" class="w-8 h-8 rounded-full object-cover"/></span></span>
    <p>Drink Menu</p>
  </div>

  <div class="flex flex-col items-center opacity-70"
    onclick="window.location.href='yourorder.html'">
    <span><img src="Yourorder.png" class="w-8 h-8 rounded-full object-cover"/></span></span>
    <p>Your Order</p>
  </div>

  <div class="flex flex-col items-center opacity-70">
    <span><img src="Favourite.png" class="w-8 h-8 rounded-full object-cover"/></span></span>
    <p>Favourite</p>
  </div>

</div>
  <!-- SIDE NAV -->
<div id="sideNav" class="fixed top-0 left-0 h-full w-[75%] max-w-[300px] bg-[#FCF2D9] z-[9999] transform -translate-x-full transition-all duration-500 rounded-r-[40px] shadow-xl p-5">

  <!-- PROFILE -->
  <div class="flex items-center gap-3 mb-6">
    <img src="photo.png" class="w-12 h-12 rounded-full object-cover"/>
    <h2 class="text-lg font-semibold text-[#834D1E]">Profile</h2>
  </div>

  <hr class="border-[#834D1E]/30 mb-4">

  <!-- MENU ITEMS -->
  <div class="space-y-6 text-[#834D1E]">

    <div class="flex items-center gap-4 text-lg">
      <span><img src="Settings.png" class="w-8 h-8 rounded-full object-cover"/></span>
      <p>Settings</p>
    </div>

    <div class="flex items-center gap-4 text-lg">
      <span><img src="Help.png" class="w-8 h-8 rounded-full object-cover"/></span></span>
      <p>Help</p>
    </div>

    <div class="flex items-center gap-4 text-lg">
      <span><img src="Logout.png" class="w-8 h-8 rounded-full object-cover"/></span></span>
      <p>Logout</p>
    </div>

  </div>

</div>

<!-- OVERLAY -->
<div id="overlay" onclick="closeNav()" class="fixed inset-0 bg-black/30 z-[9998] hidden"></div>

  <script>
function openNav() {
  document.getElementById("sideNav").classList.remove("-translate-x-full");
  document.getElementById("overlay").classList.remove("hidden");
}

function closeNav() {
  document.getElementById("sideNav").classList.add("-translate-x-full");
  document.getElementById("overlay").classList.add("hidden");
}
  </script>
  <script>
function showTab(tab) {
  // List of tab IDs
  const tabs = ["coffee", "chocolate", "others"];
  const tabButtons = {
    coffee: "tabCoffee",
    chocolate: "tabChocolate",
    others: "tabOthers"
  };

  // Hide all tabs and reset button styles
  tabs.forEach(t => {
    document.getElementById(t).classList.add("hidden");
    document.getElementById(tabButtons[t]).className = "w-1/3 py-2 bg-[#FCF2D9] text-[#834D1E]";
  });

  // Show selected tab and highlight button
  document.getElementById(tab).classList.remove("hidden");
  document.getElementById(tabButtons[tab]).className = "w-1/3 py-2 bg-[#834D1E] text-[#FCF2D9]";
}
  </script>

</body>
</html>
